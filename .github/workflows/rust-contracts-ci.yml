name: Rust Contracts CI

on:
  push:
    branches: [main, master, feature/*]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm32-unknown-unknown]
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (cargo build --target wasm32-unknown-unknown)
        run: cargo build ${{ matrix.target != 'native' && '--target wasm32-unknown-unknown --release' || '' }} --verbose

      - name: Upload wasm artifacts
        if: matrix.target == 'wasm32-unknown-unknown'
        uses: actions/upload-artifact@v4
        with:
          name: wasm-contracts
          path: target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 7

  test:
    name: Test (all features)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests (cargo test --all-features)
        run: cargo test --all-features --verbose

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm32-unknown-unknown]
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting (cargo fmt --check)
        run: cargo fmt --check

      - name: Run clippy (cargo clippy -- -D warnings)
        run: cargo clippy ${{ matrix.target != 'native' && '--target wasm32-unknown-unknown' || '' }} -- -D warnings

  coverage:
    name: Coverage (>=80%)
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install tarpaulin
        run: |
          curl -Ls https://github.com/xd009642/tarpaulin/releases/latest/download/cargo-tarpaulin-x86_64-unknown-linux-musl.tar.gz | \
            tar -xz -C ~/.cargo/bin

      - name: Generate coverage report (cargo-tarpaulin)
        run: cargo tarpaulin --all-features --fail-under 80 --out Xml --output-dir coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  ci-summary:
    name: CI Quality Gate
    runs-on: ubuntu-latest
    needs: [build, test, lint, coverage]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Check all jobs passed
        if: ${{ !(needs.build.result == 'success' && needs.test.result == 'success' && needs.lint.result == 'success' && needs.coverage.result == 'success') }}
        run: |
          echo "::error::CI pipeline failed. Build: ${{ needs.build.result }}, Test: ${{ needs.test.result }}, Lint: ${{ needs.lint.result }}, Coverage: ${{ needs.coverage.result }}"
          exit 1
      - name: All checks passed
        run: echo "✅ All CI checks passed: build, test, lint, coverage"
