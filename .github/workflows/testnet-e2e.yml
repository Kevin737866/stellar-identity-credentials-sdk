name: Testnet E2E Integration Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # Run daily at 02:00 UTC to catch network regression
    - cron: '0 2 * * *'

env:
  SOROBAN_RPC_URL: 'https://soroban-testnet.stellar.org'
  SOROBAN_NETWORK_PASSPHRASE: 'Test SDF Network ; September 2015'
  CARGO_TERM_COLOR: always

jobs:
  rust-testnet-e2e:
    name: Rust Testnet Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run E2E Integration Tests on Testnet
        run: |
          echo "=== RUNNING STELLAR TESTNET E2E TESTS ==="
          cargo test --test '*' e2e_testnet -- --nocapture 2>&1 | tee testnet-rust-output.txt || cargo test e2e_testnet -- --nocapture 2>&1 | tee testnet-rust-output.txt

      - name: Report Rust Testnet Results
        if: always()
        run: |
          echo "### Stellar Testnet E2E (Rust Contracts) Results" >> $GITHUB_STEP_SUMMARY
          echo "| Workflow | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          grep -q "testnet_e2e_did_kyc_reputation_revoke ... ok" testnet-rust-output.txt && echo "| 1. DID -> KYC -> Verify -> Reputation -> Revoke | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY || echo "| 1. DID -> KYC -> Verify -> Reputation -> Revoke | ❌ FAILED |" >> $GITHUB_STEP_SUMMARY
          grep -q "testnet_e2e_multisig_did_lifecycle ... ok" testnet-rust-output.txt && echo "| 2. Multi-sig DID -> Create Op -> Sign -> Execute | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY || echo "| 2. Multi-sig DID -> Create Op -> Sign -> Execute | ❌ FAILED |" >> $GITHUB_STEP_SUMMARY
          grep -q "testnet_e2e_credential_offer_accept_verify ... ok" testnet-rust-output.txt && echo "| 3. Credential Offer -> Accept -> Verify | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY || echo "| 3. Credential Offer -> Accept -> Verify | ❌ FAILED |" >> $GITHUB_STEP_SUMMARY
          grep -q "testnet_e2e_did_recovery_lifecycle ... ok" testnet-rust-output.txt && echo "| 4. DID Recovery -> Initiate -> Approve -> Execute | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY || echo "| 4. DID Recovery -> Initiate -> Approve -> Execute | ❌ FAILED |" >> $GITHUB_STEP_SUMMARY

  sdk-testnet-e2e:
    name: SDK Testnet Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run SDK Testnet E2E Tests
        env:
          SOROBAN_RPC_URL: ${{ env.SOROBAN_RPC_URL }}
          TESTNET_SECRET_KEY: ${{ secrets.TESTNET_SECRET_KEY }}
        run: |
          npx jest sdk/src/__tests__/testnetE2E.test.ts --verbose --runInBand 2>&1 | tee testnet-sdk-output.txt

      - name: Report SDK Testnet Results
        if: always()
        run: |
          echo "### Stellar Testnet E2E (TypeScript SDK) Results" >> $GITHUB_STEP_SUMMARY
          echo "| Workflow | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 1. DID -> KYC -> Verify -> Reputation -> Revoke | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| 2. Multi-sig DID -> Create Op -> Sign -> Execute | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| 3. Credential Offer -> Accept -> Verify | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| 4. DID Recovery -> Initiate -> Approve -> Execute | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
