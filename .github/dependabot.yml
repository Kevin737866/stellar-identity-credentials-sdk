version: 2
updates:
  # Rust dependencies — pin the toolchain and automate Cargo patch/minor updates.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      cargo-core:
        patterns:
          - "*"
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
    allow:
      - dependency-type: "direct"
    ignore:
      # Security advisories take priority and are never ignored.
    rebase-strategy: "auto"

  # Node.js / npm dependencies — automate patch/minor updates; majors need review.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-core:
        patterns:
          - "*"
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "node"
    allow:
      - dependency-type: "direct"
    ignore:
      # Security advisories take priority and are never ignored.
    rebase-strategy: "auto"
